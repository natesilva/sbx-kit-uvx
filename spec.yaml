schemaVersion: "1"
kind: mixin
name: uvx
displayName: uvx (Astral uv)
description: "Installs the Astral uv CLI so the agent can use `uvx` to run Python tools from PyPI in ephemeral, isolated environments."

caps:
  network:
    allow:
      # Astral's install script, fetched once at setup. astral.sh 301-redirects
      # to releases.astral.sh, which serves both the script and the uv tarball
      # it downloads.
      - "astral.sh:443"
      - "releases.astral.sh:443"
      # Every `uvx <tool>` invocation resolves and downloads that tool's wheels
      # from PyPI at runtime.
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # The installer fetches the uv release tarball from GitHub, and
      # `uv python install` (plus the implicit download when a tool requests a
      # Python version the sandbox doesn't have) pulls standalone CPython builds
      # from astral-sh/python-build-standalone. Both 302-redirect to the release
      # asset hosts.
      - "github.com:443"
      - "objects.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"

environment:
  variables:
    # Hardlinks from the cache into a tool venv fail across filesystem boundaries
    # in the microVM; copying is slightly slower but always works.
    UV_LINK_MODE: "copy"
    # uv's own resolver output is not a terminal here; keep logs readable.
    UV_NO_PROGRESS: "1"

commands:
  install:
    # Astral's official installer. It is fetched to disk and then run, rather
    # than piped straight into `sh`: a piped download that dies mid-transfer
    # still exits 0 through the pipe, so the failure would be invisible. The URL
    # pins the version — the unversioned https://astral.sh/uv/install.sh always
    # installs whatever is current.
    #
    # The script carries an embedded SHA256 for each platform's uv tarball and
    # hard-fails on mismatch, so pinning the script's own digest transitively
    # pins the binary: one constant covers both hops, and releases.astral.sh is
    # trusted once here rather than on every sandbox build. The digest is
    # arch-independent (one script serves all platforms).
    #
    # If this check ever fires, `sbx create` aborts with a bare
    # "500 Internal Server Error" — the real message is in sandboxd's daemon.log.
    - command: |
        set -eu
        INSTALLER_SHA256=43aff33a967fe40e8c17949d8c85c65bc43f3b5c94742393c957f56ab5ba80f4
        curl --proto '=https' --tlsv1.2 -fsSL \
          -o /tmp/uv-install.sh https://astral.sh/uv/0.11.32/install.sh
        echo "${INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
        UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh /tmp/uv-install.sh
        rm /tmp/uv-install.sh
        uv --version
        uvx --version
      user: "0"
      description: "Install uv/uvx v0.11.32 via Astral's official installer"

    # `uv tool install` puts executables in ~/.local/bin, which is not on PATH in
    # the stock image. `uvx` itself works without this, but persistently installed
    # tools would otherwise be invisible to the agent.
    - command: |
        set -eu
        mkdir -p ~/.local/bin
        grep -qF '# uvx kit' ~/.bashrc 2>/dev/null || \
          printf '\n# uvx kit\ncase ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) export PATH="$HOME/.local/bin:$PATH" ;; esac\n' >> ~/.bashrc
      user: "1000"
      description: Put ~/.local/bin on PATH for tools installed via `uv tool install`

agentContext: |
  `uv` and `uvx` are installed and on `PATH`.

  Use `uvx <tool>` to run a Python CLI from PyPI in a throwaway isolated
  environment without installing it into the project — for example
  `uvx ruff check .` or `uvx --from httpie http <url>`. Pin when it
  matters: `uvx ruff@0.14.0 check .`.

  Use `uv tool install <tool>` when a tool should persist across invocations;
  its executables land in `~/.local/bin`, which is on `PATH` in interactive
  shells.

  Network egress is restricted to PyPI (plus GitHub for standalone CPython
  downloads). A tool that reaches any other host at runtime will fail until
  that domain is added to the kit's `caps.network.allow`.
